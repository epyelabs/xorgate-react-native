name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 is the floor `engines` promises; 22 is what most consumers run.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Pack the artifact, install it into an empty project and import it as a
      # consumer would (the check that found @xorgate/sdk@0.1.0's credential
      # leak after every other suite had passed).
      - run: npm run verify:tarball
